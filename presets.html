<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>پریست‌ها | Studio Fanos</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><link rel="stylesheet" href="style.css">
<script src="lib.js" defer></script><script src="app.js" defer></script></head><body>
<div class="top"><h1>🎨 فروشگاه پریست</h1><p>پریست‌های آماده لایت‌روم برای رنگ‌بندی حرفه‌ای</p></div><section><div class="grid" id="prs"></div></section><section id="mine" style="display:none"><h2>سفارش‌های من</h2><div id="myo"></div></section>
<script>window.addEventListener("DOMContentLoaded",()=>{init(['presets'],()=>{$('#prs').innerHTML=S.presets.map(p=>`<div class="card"><div class="ph" ${im(p.img)}>${p.img?'':'🎨'}</div><div class="b"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><span class="price">${fa(p.price)} تومان</span> <button class="btn s" data-o="presets:${p.id}">خرید و پرداخت</button></div></div>`).join('')||'<p>به‌زودی…</p>'});})</script></body></html>
