<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="app.js" defer></script></head><body>
<div class="hero"><h1>Studio Fanos</h1><p id="tag"></p><a class="btn" href="book.html">رزرو وقت عکاسی</a> <a class="btn o" href="courses.html">دوره‌های آموزشی</a></div>
<section><div class="grid"><a class="card" href="portfolio.html"><span class="e">📷</span><b>نمونه‌کارها</b></a><a class="card" href="book.html"><span class="e">📅</span><b>رزرو و انتخاب لوکیشن</b></a><a class="card" href="presets.html"><span class="e">🎨</span><b>فروشگاه پریست</b></a><a class="card" href="courses.html"><span class="e">🎓</span><b>دوره‌های آموزشی</b></a></div></section>
<section><h2>درباره ما</h2><p id="aboutT"></p><div class="grid" id="locs"></div></section>
<section><h2>تازه‌ترین نمونه‌کارها</h2><div class="grid" id="ports"></div><p style="text-align:center"><a class="btn o" href="portfolio.html">مشاهده همه</a></p></section>
<script>window.addEventListener("DOMContentLoaded",()=>{init(['portfolio'],()=>{const c=cfg();$('#tag').textContent=c.tag;$('#aboutT').textContent=c.about;
$('#locs').innerHTML=(c.locs||'').split('\n').filter(x=>x.trim()).map(x=>x.split('|').map(y=>y.trim())).map(l=>`<div class="card"><div class="b"><h3>📍 ${esc(l[0])}</h3><p>${esc(l[1]||'')}</p></div></div>`).join('');
$('#ports').innerHTML=S.portfolio.slice(0,4).map(p=>`<div class="card"><div class="ph" ${im(p.img)}>${p.img?'':'📷'}</div><div class="b"><h3>${esc(p.title)}</h3><p>${esc(p.cat)}</p></div></div>`).join('')||'<p>به‌زودی…</p>'});})</script></body></html>
